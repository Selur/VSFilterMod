name: Build wheels

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows x64
    # windows-2022 has the v143 toolset with MFC.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: >-
          msbuild VSFilterMod.sln /m /t:Rebuild
          /p:Configuration="Release (MOD)"
          /p:Platform=x64
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /v:minimal

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install build wheel
          python -m build --wheel --outdir wheelhouse
          # The DLL is x64 Windows only, the wheel is tagged accordingly.
          python -m wheel tags --platform-tag win_amd64 --remove wheelhouse/*.whl
          ls wheelhouse

      - name: Test the wheel
        shell: bash
        run: |
          python -m pip install VapourSynth wheelhouse/*.whl
          python tests/test_vsfiltermod.py

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-windows
          path: wheelhouse/*.whl

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.whl
          generate_release_notes: true
